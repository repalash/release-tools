name: deploy

# Reusable workflow: deploys after a reviewer approves an environment, with the same notice and Claude review as
# npm-release.yml. Usage and repository setup: README.md of this repository.
#
# Jobs:
#   check    checks that the environment requires a reviewer, then runs the `check` command (install, tests).
#            Runs the caller's code; has no secrets.
#   notify   starts the Claude review routine and posts the Discord notice: the approval link, the review and the
#            commits since the last successful deployment of the environment; or that the check failed. Runs only
#            the scripts of this repository; it has the secrets and never runs the caller's code.
#   deploy   environment `environment` (the approval): the `install` command (the secrets are not in its environment),
#            then a step of this repository puts the secrets named in `secrets-env` in the job's environment, then the
#            `deploy` command runs with those. The caller passes them by name (the ones declared under `secrets`). The job's runner holds every secret the job has, and the caller's code
#            runs on it: pass this workflow only the secrets it needs (README, Security).
#   failed   when the deploy started and failed (not when the approval was rejected): the Discord notice, from a job
#            of its own (the deploy job ran caller code).
#
# The jobs check out the scripts of this repository at the commit of this workflow file (job.workflow_repository,
# job.workflow_sha), so a caller pinned to a tag or commit runs the matching scripts.

on:
  workflow_call:
    inputs:
      environment:
        description: 'The GitHub environment to deploy to. It must have a required reviewer: the approval.'
        type: string
        required: true
      deploy:
        description: 'Shell command that deploys, run in working-directory after the approval.'
        type: string
        required: true
      check:
        description: 'Shell command run in working-directory before the approval (install, typecheck, tests), with no secrets. Empty: none.'
        type: string
        default: ''
      install:
        description: 'Shell command run in working-directory after the approval and before the secrets are set (`npm ci`), so dependency install scripts never get them. Empty: none.'
        type: string
        default: ''
      working-directory:
        description: 'Directory of the deployed project; the commit list of the notice covers it.'
        type: string
        default: '.'
      secrets-env:
        description: 'Names of the secrets the deploy command gets as environment variables, separated by spaces or commas.'
        type: string
        default: ''
      name:
        description: 'What is deployed, for the notices. Empty: `<repository> (<environment>)`.'
        type: string
        default: ''
      node-version:
        description: 'Node.js version for the check and the deploy.'
        type: string
        default: '24'
      review-actor:
        description: 'GitHub user whose pushes start the Claude review routine. Empty: never.'
        type: string
        default: 'repalash'
    secrets:
      DISCORD_WEBHOOK_URL:
        description: 'Discord webhook for the notices (optional).'
        required: false
      CLAUDE_REVIEW_FIRE_URL:
        description: 'Fire URL of the Claude Code review routine (optional).'
        required: false
      CLAUDE_REVIEW_TOKEN:
        description: 'Bearer token of the Claude Code review routine (optional).'
        required: false
      # The deploy's own secrets. GitHub gives a reusable workflow only the secrets its caller passes, environment
      # secrets too, and the caller can pass by name only the ones declared here: list a name in `secrets-env` and
      # pass it from the caller (`NAME: ${{ secrets.NAME }}`, which resolves to the environment's secret).
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API token for the deploy command (wrangler), from the environment (optional).'
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Cloudflare account id for the deploy command, when the wrangler config has none (optional).'
        required: false
      ADMIN_SERVICE_TOKEN:
        description: 'teenybase admin token: later deploys apply migrations through the deployed Worker with it (optional).'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Move the release scripts out of the workspace
        run: mv .release-tools "$RUNNER_TEMP/release-tools"
      # GitHub creates a missing environment on first use, without protection rules: the deploy job would then run
      # without approval. Stop when the environment has no required reviewer.
      - name: Check that the environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: node "$RUNNER_TEMP/release-tools/scripts/require-reviewer.mjs" "$ENVIRONMENT"
      - uses: actions/checkout@v7
        if: inputs.check != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: inputs.check != ''
        with:
          package-manager-cache: false # no dependency cache in deploy builds
          node-version: ${{ inputs.node-version }}
      - name: Check
        if: inputs.check != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          CHECK_COMMAND: ${{ inputs.check }}
        run: eval "$CHECK_COMMAND"

  notify:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read # the last successful deployment, for the commit list
    steps:
      # the caller's history only, for the commit list: its code is never run here
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Move the release scripts out of the workspace
        run: mv .release-tools "$RUNNER_TEMP/release-tools"
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24
      - name: Claude review and Discord notice
        env:
          STATE: ${{ needs.check.result == 'success' && 'waiting' || 'check-failed' }}
          ENVIRONMENT: ${{ inputs.environment }}
          NAME: ${{ inputs.name }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          REVIEW_ACTOR: ${{ inputs.review-actor }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CLAUDE_REVIEW_FIRE_URL: ${{ secrets.CLAUDE_REVIEW_FIRE_URL }}
          CLAUDE_REVIEW_TOKEN: ${{ secrets.CLAUDE_REVIEW_TOKEN }}
        run: node "$RUNNER_TEMP/release-tools/scripts/deploy-notify.mjs"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      started: ${{ steps.approved.outputs.started }} # the approval was given and the deploy began
    steps:
      # a step runs only once the environment is approved
      - name: Approved
        id: approved
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ inputs.node-version }}
      - name: Install
        if: inputs.install != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          INSTALL_COMMAND: ${{ inputs.install }}
        run: eval "$INSTALL_COMMAND"
      # after the install (its scripts cannot change these), outside the workspace
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Move the release scripts out of the workspace
        run: mv .release-tools "$RUNNER_TEMP/release-tools"
      # its own step: the deploy command gets the listed secrets only (export-secrets.mjs)
      - name: Secrets for the deploy
        env:
          SECRETS_ENV: ${{ inputs.secrets-env }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node "$RUNNER_TEMP/release-tools/scripts/export-secrets.mjs"
      - name: Deploy
        working-directory: ${{ inputs.working-directory }}
        env:
          DEPLOY_COMMAND: ${{ inputs.deploy }}
        run: eval "$DEPLOY_COMMAND"

  failed:
    needs: deploy
    # a rejected or timed-out approval fails the deploy job too, before any step: no notice then
    if: ${{ failure() && needs.deploy.result == 'failure' && needs.deploy.outputs.started == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24
      - name: Discord notice of a failed deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          NAME: ${{ inputs.name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/deploy-notify.mjs --failed
