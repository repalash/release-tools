# .github/workflows/publish.yml of threepipe: the core package at the root and its plugins in plugins/*, npm workspaces.
# Each public package whose version is not on npm is published, dependencies first, after approval. partial: a plugin
# that fails to build is left out (and what depends on it), the others are published; post-build must pass (the
# published declarations checked as a consumer, the docs). The build also type-checks the examples. Tags: v<version>
# for the core, <name>-<version> for a plugin.
name: Publish packages to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # tags
      id-token: write # npm trusted publishing
    uses: repalash/release-tools/.github/workflows/npm-release.yml@v1
    with:
      packages: . plugins/* !plugins/plugin-template-*
      build: npm ci && npm run build:release # turbo build --continue, then the examples type check
      post-build: npm run test:types && npm run docs-all
      partial: true
      clean-package: true
      require-changelog: true
      tag-format: '{name}-{version}'
      root-tag-format: 'v{version}'
      node-version: '22'
    secrets: inherit
